---
# Single source of truth for the fleet-wide sysctl baseline (Ch13). Every
# value here is rendered into /etc/sysctl.d/99-fleet-baseline.conf on every
# managed host — change it here, not by hand on a host.
sysctl_baseline:
  vm.swappiness: 10
  net.core.somaxconn: 4096
  net.ipv4.tcp_max_syn_backlog: 8192
  net.ipv4.ip_forward: 0
  kernel.pid_max: 4194304
  kernel.panic: 10
  kernel.panic_on_oops: 1
