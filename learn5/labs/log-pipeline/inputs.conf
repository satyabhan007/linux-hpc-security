# Splunk inputs.conf — forwarder-side monitor stanzas, plus the
# forwarder health-monitoring stanza that Ch 2 Scenario A ("logs stopped
# flowing from rack 12") depends on. A forwarder that cannot report its
# own queue depth is a monitoring blind spot, not a working pipeline.

[monitor:///var/log/syslog]
index      = infra_logs
sourcetype = infra:syslog
host_segment = 3

[monitor:///var/lib/node_exporter/textfile/*.prom]
index      = infra_logs
sourcetype = infra:node_exporter_textfile

[monitor:///var/log/auth.log]
index      = audit_logs
sourcetype = audit:auth

[monitor:///var/log/app/*.log]
index      = debug_logs
sourcetype = debug:app
whitelist  = \.log$

# Forwarder self-monitoring: internal metrics (queue depth, dropped
# events) shipped to a dedicated index so `NodeExporterDown`-style
# staleness alerting (see ../observability/alerts.rules.yml) has
# something to alert on for the LOG pipeline, not just the metrics
# pipeline. This is the fix for Ch 2 Scenario A.
[monitor:///opt/splunkforwarder/var/log/splunk/metrics.log]
index      = _internal
sourcetype = splunkd

[default]
# host = <set-per-forwarder-at-deploy-time>
