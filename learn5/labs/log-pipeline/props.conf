# Splunk props.conf — sourcetype parsing rules.
# Index-time field extraction kept deliberately lean (Ch 2, L3/L4): only
# timestamp, host, and severity are pulled at index time. Everything else
# (job_id, error_code, etc.) is left to search-time extraction so the
# schema stays cheap to evolve.

[infra:syslog]
TIME_FORMAT       = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 32
SHOULD_LINEMERGE  = false
TRUNCATE          = 10000
# lean index-time extraction: severity only, everything else stays raw
# and gets search-time field extraction (Ch 2, "field extraction at
# ingest, not at search time, when you can afford it").
EXTRACT-severity  = ^\S+\s+\d+\s+\S+\s+\S+\s+(?<severity>\w+):

[infra:node_exporter_textfile]
TIME_FORMAT       = %Y-%m-%dT%H:%M:%S
SHOULD_LINEMERGE  = false
KV_MODE           = auto
# node_exporter textfile-collector output already looks like
# `metric_name{label="value"} 123 1699999999` — auto key=value extraction
# handles the label set without a custom regex.

[audit:auth]
TIME_FORMAT       = %Y-%m-%dT%H:%M:%S%z
SHOULD_LINEMERGE  = false
TRUNCATE          = 10000
EXTRACT-user,EXTRACT-action,EXTRACT-result = user=(?<user>\S+)\s+action=(?<action>\S+)\s+result=(?<result>\w+)

[debug:app]
TIME_FORMAT       = %Y-%m-%d %H:%M:%S,%3N
SHOULD_LINEMERGE  = true
BREAK_ONLY_BEFORE = ^\d{4}-\d{2}-\d{2}
TRUNCATE          = 100000
# no index-time extraction here on purpose — debug logs are short-lived
# (7-day retention in indexes.conf) and rarely searched, so paying the
# index-time extraction cost is not worth it.
