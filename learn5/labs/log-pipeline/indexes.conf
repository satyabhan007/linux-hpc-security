# Splunk indexes.conf — hot/warm/cold/frozen tiering + retention for the
# production-ops log pipeline described in learn5 Ch 2 (centralized
# logging) and Ch 3 (log pipeline architecture: ingestion, indexing &
# retention).
#
# Three indexes, three different retention/access postures — the Ch 3
# anti-pattern this file fixes is "one retention policy for every log
# type": audit logs need 1 year for compliance, infra logs need 90 days
# for operational troubleshooting, and debug logs need only 7 days because
# nobody queries them past that window.

[infra_logs]
# General infrastructure logs: syslog, systemd journal exports, service
# logs from the fleet in ../observability/prometheus.yml.
homePath      = $SPLUNK_DB/infra_logs/db
coldPath      = $SPLUNK_DB/infra_logs/colddb
thawedPath    = $SPLUNK_DB/infra_logs/thaweddb
# 90 days hot+warm+cold, then frozen (archived to cheap storage, not
# deleted) — matches the Ch 3 "sizing a hot/warm/cold Splunk storage tier"
# scenario.
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB     = 512000
coldToFrozenDir        = /mnt/cold-archive/infra_logs

[audit_logs]
# Security/compliance-relevant logs: auth events, privilege escalation,
# config changes. Longer retention because compliance regimes (not query
# frequency) drive this number — the Ch 3 "retention is a compliance-vs-
# cost negotiation, not a technical default" principle.
homePath      = $SPLUNK_DB/audit_logs/db
coldPath      = $SPLUNK_DB/audit_logs/colddb
thawedPath    = $SPLUNK_DB/audit_logs/thaweddb
frozenTimePeriodInSecs = 31536000
maxTotalDataSizeMB     = 256000
coldToFrozenDir        = /mnt/cold-archive/audit_logs

[debug_logs]
# Verbose/debug output from services in active development or
# investigation. Short retention on purpose — this is the index the Ch 2
# "sourcetype that ate the license" scenario is about isolating so a
# misbehaving debug stream cannot blow the whole fleet's ingest budget.
homePath      = $SPLUNK_DB/debug_logs/db
coldPath      = $SPLUNK_DB/debug_logs/colddb
thawedPath    = $SPLUNK_DB/debug_logs/thaweddb
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB     = 51200
