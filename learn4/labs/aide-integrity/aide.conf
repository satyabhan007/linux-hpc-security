# aide.conf — scoped file-integrity baseline.
# Companion to Chapter 9 (file integrity monitoring & host-based intrusion
# prevention). Watches security-critical paths only — not the whole
# filesystem — so real alerts aren't buried in high-churn noise.

# Where the database lives (moved to a read-only/off-host location by
# init-baseline.sh after generation — see README.md).
database=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz

# Report format
report_url=file:/var/log/aide/aide.log
gzip_dbout=yes

# Rule groups: what to hash/track for each class of path.
# NORMAL   = permissions + ownership + size + hashes (binaries — should
#            almost never change outside a patch window, Chapter 7).
# LOGGROW  = permissions + ownership only (paths that grow/rotate normally).
NORMAL = p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256
LOGGROW = p+u+g+n

# Binaries and libraries — should only change during a reviewed patch.
/usr/bin   NORMAL
/usr/sbin  NORMAL
/usr/lib   NORMAL
/usr/lib64 NORMAL

# Boot files — kernel/initramfs tampering is a rootkit-class concern
# (Chapter 4: kernel hardening).
/boot NORMAL

# Configuration — watch content and permissions, but exclude high-churn
# subpaths that are expected to change during normal operation.
/etc NORMAL
!/etc/mtab
!/var/log

# Explicitly watch the auth-critical files individually so a change is
# never missed even if a broader exclude is added above later.
/etc/passwd  NORMAL
/etc/shadow  NORMAL
/etc/sudoers NORMAL
/etc/ssh/sshd_config NORMAL
