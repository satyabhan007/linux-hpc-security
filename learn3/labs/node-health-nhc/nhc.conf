# Part 3 lab — NHC (LBNL Node Health Check) rule set for GPU Xid errors
# Companion to Chapter 9 (automated remediation) and Chapter 6 (GRES/GPU).
#
# NHC config syntax: each active rule line is "<hostmask> || <check-call>".
# The hostmask is matched against the local hostname (glob patterns), so
# GPU-only checks can be scoped to GPU node classes without affecting
# CPU-only nodes running the same shared nhc.conf.

# ---------------------------------------------------------------------
# Confirm the expected GPU count is actually present and healthy before
# even looking at dmesg — a GPU that's disappeared entirely (fallen off
# the PCIe bus, or never enumerated after a reboot) is caught here.
# check_hw_gpu is a built-in NHC check; the argument is the expected
# device count for this node class.
# ---------------------------------------------------------------------
*.gpu*    || check_hw_gpu 8
*.bignode* || check_hw_gpu 8

# ---------------------------------------------------------------------
# Xid error patterns in the kernel ring buffer (dmesg). NHC's check_dmesg
# accumulates custom regexes into DMESG_MATCHES; a match marks the node
# offline with the given reason string. Severity is split into two tiers:
#
#   SEVERE  (actively corrupting in-progress work) -> DOWN immediately,
#           via the "###DOWN###" marker NHC's offline handler recognizes
#           for critical hardware faults.
#   MODERATE (recoverable / won't worsen mid-job)  -> DRAIN, letting
#           already-running jobs finish before the node stops accepting
#           new ones.
# ---------------------------------------------------------------------

# Xid 79 = "GPU has fallen off the bus" — the canonical severe fault.
# Xid 48  = "Double Bit ECC Error" — actively corrupting memory.
*.gpu*    || check_dmesg -e 'NVRM: Xid.*: 79,' -c "###DOWN### GPU fallen off bus (Xid 79)"
*.gpu*    || check_dmesg -e 'NVRM: Xid.*: 48,' -c "###DOWN### Double-bit ECC error (Xid 48)"

# Xid 13 = graphics engine exception (often a driver/app bug, not always
#          fatal hardware). Xid 31 = GPU memory page fault. Xid 43 =
#          GPU stopped processing. These are drained, not downed, so a
#          human can triage before removing the node from service
#          entirely — see Chapter 9's DRAIN-vs-DOWN severity discussion.
*.gpu*    || check_dmesg -e 'NVRM: Xid.*: (13|31|43),' -c "GPU Xid error detected - draining for triage"

# ---------------------------------------------------------------------
# Baseline checks that apply to every node regardless of class — kept
# minimal here since this lab is scoped to the GPU/Xid story specifically
# (Chapter 9); a full production nhc.conf also checks filesystem mounts,
# swap usage, and process-table health.
# ---------------------------------------------------------------------
*         || check_fs_mount -f /scratch -t lustre
