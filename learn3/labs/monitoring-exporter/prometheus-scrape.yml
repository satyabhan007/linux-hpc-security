# Part 3 lab — Prometheus scrape config for Slurm job-efficiency +
# GPU telemetry (Chapter 13). Meant to be merged into a site's real
# prometheus.yml scrape_configs list, not run standalone.

scrape_configs:
  - job_name: "slurm-exporter"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "slurm-ctl1.cluster.local:8080"
        labels:
          role: "controller"

  - job_name: "dcgm-exporter"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "gpu001.cluster.local:9400"
          - "gpu002.cluster.local:9400"
          - "gpu003.cluster.local:9400"
          - "gpu004.cluster.local:9400"
        labels:
          role: "gpu-compute"

  - job_name: "node-exporter"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "cpu001.cluster.local:9100"
          - "cpu002.cluster.local:9100"
          - "gpu001.cluster.local:9100"
          - "gpu002.cluster.local:9100"
        labels:
          role: "compute"

rule_files:
  - "alerts.yml"
