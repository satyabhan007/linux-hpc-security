name: Deploy linux-hpc-security to GitHub Pages

# Publishes the static site plus the raw lesson sources so in-page links to
# `<module>/stepN_*.py` and `<module>/*.md` resolve (Pages serves them as
# plain text / rendered markdown). Package: index.html, 404.html, assets/,
# learn/, and every module dir. Excludes: __pycache__, .github/.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site package (static site + raw lesson sources)
        run: |
          rm -rf _site_pkg && mkdir -p _site_pkg
          cp index.html 404.html _site_pkg/ 2>/dev/null || true
          cp README.md LICENSE _site_pkg/ 2>/dev/null || true
          cp -r assets learn _site_pkg/
          for d in linux hardening stigs benchmarking ebpf ansible warewulf \
                   hpc fabric storage containers tuning \
                   linux-security encrypted-anomaly fraud-detection key-management \
                   soc noc splunk chaos redblue; do
            [ -d "$d" ] && mkdir -p "_site_pkg/$d" && \
              find "$d" \( -name '*.md' -o -name '*.py' -o -name '*.yml' -o -name '*.yaml' -o -name '*.sh' -o -name '*.conf' \) \
                -not -path '*/__pycache__/*' -exec cp --parents {} _site_pkg/ \;
          done
          du -sh _site_pkg && find _site_pkg -type f | head -80

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_pkg

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
