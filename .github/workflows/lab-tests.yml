name: Lab Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the full lab suite (all 63 steps, zero deps)
        run: python3 run_all.py

  per-module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - linux
          - hardening
          - stigs
          - benchmarking
          - ebpf
          - ansible
          - warewulf
          - hpc
          - fabric
          - storage
          - containers
          - tuning
          - linux-security
          - encrypted-anomaly
          - fraud-detection
          - key-management
          - soc
          - noc
          - splunk
          - chaos
          - redblue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ${{ matrix.module }} steps
        run: |
          for f in ${{ matrix.module }}/step*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile every lab
        run: python3 -m compileall -q linux hardening stigs benchmarking ebpf ansible warewulf hpc fabric storage containers tuning linux-security encrypted-anomaly fraud-detection key-management soc noc splunk chaos redblue run_all.py
      - name: shellcheck example scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './.git/*' -print -exec shellcheck -S warning {} +
